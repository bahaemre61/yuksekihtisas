                sessionId: { type: string }
                requestType: { type: string, enum: [NEW_DOCUMENT, REVISION, REVOCATION] }
                documentName: { type: string }
                documentNo: { type: string }
                reason: { type: string }
                feedback: { type: string }
                evidenceId: { type: string }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/evidence/users:
    get:
      tags: [Kanıt Sistemi]
      summary: Kanıt sisteminde atanabilir kullanıcılar
      responses:
        '200':
          description: Kullanıcılar
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id: { type: string }
                    name: { type: string }
                    email: { type: string }
                    role: { type: string }
    post:
      tags: [Kanıt Sistemi]
      summary: Kullanıcının kanıt rolünü değiştir
      description: "Roller: `admin`, `kanit_sorumlu`, `supervisor`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId, newRole]
              properties:
                targetUserId: { type: string }
                newRole: { $ref: '#/components/schemas/Role' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/evidence/templates:
    get:
      tags: [Kanıt Sistemi]
      summary: Doküman şablonu listesi
      security: []
      responses:
        '200':
          description: Şablon dosya yolları
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/evidence/templates/{type}:
    get:
      tags: [Kanıt Sistemi]
      summary: Doküman şablonunu indir (.docx)
      description: "`type`: `0`/`is-akis`, `1`/`gorev-yetki`, `2`/`rapor`, `3`/`prosedur`."
      security: []
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: ['0', '1', '2', '3', is-akis, gorev-yetki, rapor, prosedur] }
      responses:
        '200':
          description: Word dosyası
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }

  # ───────────────────────── RİSK FORMU ─────────────────────────
  /api/risk-forms:
    get:
      tags: [Risk Formu]
      summary: Risk formu kayıtları (özet liste, en fazla 500)
      description: Değerlendirme rolleri hepsini, diğerleri yalnızca kendi kayıtlarını görür.
      responses:
        '200':
          description: Kayıtlar
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RiskForm' }
    post:
      tags: [Risk Formu]
      summary: Yeni risk kaydı oluştur (bölüm A ve 1-6)
      description: Zorunlu alanlar sunucuda doğrulanır; hatada `400` ve eksik alan mesajı döner. Alan listesi için `RiskForm` şemasına bakın.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiskForm' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/risk-forms/people:
    get:
      tags: [Risk Formu]
      summary: Süreç sorumlusu seçimi için kişi adları
      responses:
        '200':
          description: İsim listesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { type: string } }
  /api/risk-forms/{id}:
    get:
      tags: [Risk Formu]
      summary: Risk kaydı detayı ve düzenleme yetkileri
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Kayıt
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/RiskForm' }
                  permissions:
                    type: object
                    properties:
                      editMain: { type: boolean }
                      editKomisyon: { type: boolean }
                      editIzleme: { type: boolean }
                      editIcKontrol: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Risk Formu]
      summary: Bir bölümü kaydet
      description: |
        Gövdede `section` ile hangi bölümün güncelleneceği seçilir; alanlar o bölümün alanlarıdır.
        Bölüm yetkisi yoksa `403`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section]
              additionalProperties: true
              properties:
                section:
                  type: string
                  enum: [main, komisyon, izleme, icKontrol]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── DUYURU & YEMEK ─────────────────────────
  /api/announcements:
    get:
      tags: [Duyuru & Yemek]
      summary: Son 20 duyuru
      responses:
        '200':
          description: Duyurular
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Announcement' }
    post:
      tags: [Duyuru & Yemek]
      summary: Duyuru yayınla
      description: "Roller: `admin`, `supervisor`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string }
                content: { type: string }
                priority: { type: string, enum: [normal, urgent] }
                link: { type: string }
      responses:
        '201':
          description: Yayınlandı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/announcements/{id}:
    delete:
      tags: [Duyuru & Yemek]
      summary: Duyuruyu sil
      description: "Roller: `admin`, `supervisor`."
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/menu:
    get:
      tags: [Duyuru & Yemek]
      summary: Aylık yemek menüsü
      parameters:
        - name: month
          in: query
          description: "0-11 (Ocak = 0)"
          schema: { type: integer, minimum: 0, maximum: 11 }
        - name: year
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Günlük menüler
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Menu' }
    post:
      tags: [Duyuru & Yemek]
      summary: Günün menüsünü kaydet (varsa günceller)
      description: "Rol: `admin`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, items]
              properties:
                date: { type: string, format: date-time }
                items: { type: array, items: { type: string } }
                calories: { type: number }
      responses:
        '200':
          description: Kaydedildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────── GENEL ─────────────────────────
  /api/districts:
    get:
      tags: [Genel]
      summary: Ankara ilçe listesi
      security: []
      responses:
        '200':
          description: İlçeler
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg: { type: string }
                  data: { type: array, items: { type: string } }
  /api/locations:
    get:
      tags: [Genel]
      summary: Yerleşke / konum listesi
      security: []
      responses:
        '200':
          description: Konumlar
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { type: string } }
  /api/display-image/{filename}:
    get:
      tags: [Genel]
      summary: Yüklenen dosyayı göster / indir
      description: |
        Teknik talep ekran görüntüleri, malzeme şartnameleri ve kanıt dosyaları için. **Oturum gerekir**:
        web'de cookie otomatik gider; mobilde `Authorization: Bearer <token>` başlığı eklenmelidir
        (React Native `Image` için `source={{ uri, headers: { Authorization } }}`).
        Word/ZIP/RAR dosyaları her zaman indirme olarak döner.
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
        - name: download
          in: query
          schema: { type: boolean }
        - name: name
          in: query
          description: İndirilen dosyanın görünen adı
          schema: { type: string }
      responses:
        '200':
          description: Dosya
          content:
            '*/*':
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── YÖNETİM ─────────────────────────
  /api/admin/users:
    get:
      tags: [Yönetim]
      summary: Kullanıcı listesi
      description: "Rol: `admin`."
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Kullanıcılar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Yönetim]
      summary: Kullanıcı oluştur
      description: "Rol: `admin`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                role: { $ref: '#/components/schemas/Role' }
                manager: { type: string, nullable: true }
                canCreateMaterialRequest: { type: boolean }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAdmin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/users/{id}:
    put:
      tags: [Yönetim]
      summary: Kullanıcıyı güncelle
      description: "Rol: `admin`."
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/Role' }
                isActive: { type: boolean }
                manager: { type: string, nullable: true }
                canCreateMaterialRequest: { type: boolean }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAdmin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/bulk-import:
    get:
      tags: [Yönetim]
      summary: Toplu aktarım tipleri ve alanları
      description: "Rol: `admin`."
      responses:
        '200':
          description: Aktarılabilir tipler
          content:
            application/json:
              schema:
                type: object
                properties:
                  maxRows: { type: integer }
                  types:
                    type: array
                    items: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Yönetim]
      summary: JSON satırlarını toplu aktar
      description: "Rol: `admin`. `dryRun` varsayılan **true**'dur (sadece doğrular, yazmaz); gerçek yazım için `false` gönderin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, rows]
              properties:
                type: { type: string }
                rows: { type: array, items: { type: object, additionalProperties: true } }
                dryRun: { type: boolean, default: true }
                skipInvalid: { type: boolean, default: false }
      responses:
        '200':
          description: Aktarım raporu
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────── AI & CRON ─────────────────────────
  /api/ai/parse-request:
    post:
      tags: [AI & Cron]
      summary: Talep listesini coğrafi rotalara grupla (Gemini)
      description: Araç talep formundaki "AI ile doldur" özelliği için; oturum gerekir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { description: Gruplanacak talep listesi, type: array, items: { type: object, additionalProperties: true } }
      responses:
        '200':
          description: Gruplar
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/ai/smart-group:
    get:
      tags: [AI & Cron]
      summary: Bekleyen talepler için akıllı gruplama önerisi
      description: "Roller: `admin`, `supervisor`."
      responses:
        '200':
          description: Öneri grupları
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/ai/driver-group:
    get:
      tags: [AI & Cron]
      summary: Şoförün işleri için sefer gruplama önerisi
      description: "Rol: `driver`."
      responses:
        '200':
          description: Seferler
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/cron/auto-assign:
    get:
      tags: [AI & Cron]
      summary: Otomatik şoför atamasını çalıştır
      description: |
        Zamanlanmış çağrı `Authorization: Bearer <CRON_SECRET>` ile yapılır; ayrıca `admin`/`supervisor` oturumuyla elle tetiklenebilir.
        **Mobil istemci için değildir.**
      parameters:
        - name: slot
          in: query
          schema: { type: string, enum: [morning, afternoon, all] }
        - name: force
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Atama sonucu
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [AI & Cron]
      summary: Otomatik şoför atamasını çalıştır (GET ile aynı)
      parameters:
        - name: slot
          in: query
          schema: { type: string, enum: [morning, afternoon, all] }
        - name: force
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Atama sonucu
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`POST /api/auth/login` (X-Client-Type: mobile) yanıtındaki `token`."
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: Web arayüzü için httpOnly cookie.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId
      schema: { type: string, example: 65f1c0a2b3d4e5f607182930 }
    Category:
      name: category
      in: query
      description: "`admin` için gereklidir; `techamir`/`itadmin` kendi kategorisine sabittir."
      schema: { type: string, enum: [technical, it] }

  responses:
    Success:
      description: Başarılı
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              msg: { type: string }
    Message:
      description: Başarılı
      content:
        application/json:
          schema:
            type: object
            properties:
              msg: { type: string }
    BadRequest:
      description: Eksik veya geçersiz istek
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Token yok, geçersiz veya süresi dolmuş
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Bu işlem için yetkiniz yok
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Kayıt bulunamadı
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Sunucu hatası
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        msg: { type: string }
        error: { type: string }
        message: { type: string }
    Role:
      type: string
      enum: [user, driver, tech, techamir, it, itadmin, admin, amir, supervisor, akademik, kanit_sorumlu, raportor, mali_isler, ogrenci_isleri]
    UserBrief:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    UserAdmin:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        manager: { type: string, nullable: true }
        canCreateMaterialRequest: { type: boolean }
        driverStatus: { type: string, enum: [available, busy] }
    PushSubscription:
      type: object
      description: Tarayıcı Push API abonelik nesnesi
      properties:
        endpoint: { type: string }
        keys:
          type: object
          properties:
            p256dh: { type: string }
            auth: { type: string }
    Rating:
      type: object
      properties:
        score: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        ratedAt: { type: string, format: date-time }
    VehicleRequest:
      type: object
      properties:
        _id: { type: string }
        requestingUser:
          description: Kimlik ya da `{ _id, name, email }` (uca göre)
          oneOf:
            - type: string
            - $ref: '#/components/schemas/UserBrief'
        assignedDriver:
          nullable: true
          oneOf:
            - type: string
            - $ref: '#/components/schemas/UserBrief'
        status: { type: string, enum: [pending, assigned, completed, cancelled] }
        willCarryItems: { type: boolean }
        fromLocation: { type: string }
        toLocation: { type: string }
        purpose: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        priority: { type: string, enum: [normal, high] }
        cancelReason: { type: string, description: "Yönetici iptal/ret nedeni; talep sahibine gösterilir" }
        cancelledBy: { type: string }
        cancelledAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TechnicalRequest:
      type: object
      properties:
        _id: { type: string }
        user:
          oneOf:
            - type: string
            - type: object
              properties:
                _id: { type: string }
                name: { type: string }
                email: { type: string }
        technicalStaff:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                properties:
                  _id: { type: string }
                  name: { type: string }
        category: { type: string, enum: [technical, it], description: "Kategorisi olmayan eski kayıtlar technical sayılır" }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        screenshotUrl: { type: string, nullable: true, description: "uploads/... ; /api/display-image/{dosyaAdı} ile açılır" }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH] }
        status: { type: string, enum: [pending, assigned, in_progress, completed, cancelled] }
        completedAt: { type: string, format: date-time, nullable: true }
        rating: { $ref: '#/components/schemas/Rating' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MaterialRequest:
      type: object
      properties:
        _id: { type: string }
        batchId: { type: string }
        requester: { type: string }
        location: { type: string }
        materialType: { type: string }
        materialName: { type: string }
        quantity: { type: number }
        unit: { type: string }
        givenQuantity: { type: number }
        remainingQuantity: { type: number }
        description: { type: string }
        specification: { type: string }
        specificationFileUrl: { type: string }
        specificationFileName: { type: string }
        status: { type: string, enum: [pending_supervisor, pending_mali_isler, partially_delivered, approved, rejected] }
        supervisorNote: { type: string }
        supervisorReviewedAt: { type: string, format: date-time }
        maliIslerNote: { type: string }
        maliIslerReviewedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MeetingAttachment:
      type: object
      properties:
        _id: { type: string }
        originalName: { type: string }
        size: { type: integer, description: Bayt }
        mimeType: { type: string }
        uploadedAt: { type: string, format: date-time }
    Meeting:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        description: { type: string }
        date: { type: string, format: date-time }
        location: { type: string }
        organizer: { type: string }
        qrSecret: { type: string, description: "QR kodun içeriği; /meeting/join/{qrSecret}" }
        status: { type: string, enum: [open, closed, completed, cancelled] }
        attendees:
          type: array
          items:
            type: object
            properties:
              user: { type: object, nullable: true, properties: { _id: { type: string }, name: { type: string } } }
              guestName: { type: string }
              isGuest: { type: boolean }
              checkInTime: { type: string, format: date-time }
        minutes: { type: string, description: Tutanak metni }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/MeetingAttachment' }
        isApproved: { type: boolean }
    Task:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [todo, in_progress, completed] }
        priority: { type: string, enum: [low, medium, high] }
        dueDate: { type: string, format: date-time, nullable: true }
        createdBy: { $ref: '#/components/schemas/UserBrief' }
        assignee: { $ref: '#/components/schemas/UserBrief' }
        completedAt: { type: string, format: date-time, nullable: true }
        canManage: { type: boolean, description: Düzenleme/silme yetkisi }
        canMove: { type: boolean, description: Durum değiştirme yetkisi }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Announcement:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        content: { type: string }
        priority: { type: string, enum: [normal, urgent] }
        link: { type: string }
        href: { type: string }
        createdAt: { type: string, format: date-time }
    Menu:
      type: object
      properties:
        _id: { type: string }
        date: { type: string, format: date-time }
        items: { type: array, items: { type: string } }
        calories: { type: number }
    EvidenceSession:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        description: { type: string }
        createdBy: { type: string }
        reporters: { type: array, items: { type: string } }
        dataEntryUsers: { type: array, items: { type: string } }
        status: { type: string, enum: [active, completed, archived] }
        createdAt: { type: string, format: date-time }
    Evidence:
      type: object
      properties:
        _id: { type: string }
        sessionId: { type: string }
        title: { type: string }
        description: { type: string }
        fileUrl: { type: string, description: "/api/display-image/{dosyaAdı}" }
        fileName: { type: string }
        fileType: { type: string }
        fileSize: { type: integer }
        uploadedBy: { type: object, properties: { _id: { type: string }, name: { type: string }, email: { type: string }, role: { type: string } } }
        status: { type: string, enum: [pending, approved, rejected, revision_requested] }
        reporterNote: { type: string }
        reviewedBy: { type: object, nullable: true, properties: { _id: { type: string }, name: { type: string } } }
        reviewedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    DocumentRequest:
      type: object
      properties:
        _id: { type: string }
        sessionId: { type: string }
        evidenceId: { type: string }
        requester: { type: object, properties: { _id: { type: string }, name: { type: string }, email: { type: string }, role: { type: string } } }
        requestDate: { type: string, format: date-time }
        requestType: { type: string, enum: [NEW_DOCUMENT, REVISION, REVOCATION] }
        documentName: { type: string }
        documentNo: { type: string }
        reason: { type: string }
        feedback: { type: string }
        status: { type: string, enum: [pending, approved, rejected, revision_requested] }
    RiskForm:
      type: object
      description: |
        Tek kayıt, dört bölüm: birim sorumlusu (A + 1-6), komisyon (7), izleme (8), iç kontrol (9).
        Alanların tam listesi ve zorunluluk kuralları sunucuda (`riskSanitize`) tanımlıdır; liste ucu özet alanları döner.
      properties:
        _id: { type: string }
        birim: { type: string }
        altBirim: { type: string }
        surec: { type: string }
        surecSorumlusu: { type: string }
        riskBaslik: { type: string }
        riskTanim: { type: string }
        riskNeden: { type: string }
        riskSonuc: { type: string }
        riskKategorileri: { type: array, items: { type: string } }
        riskKategoriDiger: { type: string }
        olasilik: { type: integer, minimum: 1, maximum: 5 }
        etki: { type: integer, minimum: 1, maximum: 5 }
        riskPuani: { type: integer, minimum: 1, maximum: 25 }
        puanGerekce: { type: string }
        komisyon: { type: object, additionalProperties: true }
        izleme: { type: object, additionalProperties: true }
        icKontrol: { type: object, additionalProperties: true }
        createdBy: { type: object, properties: { _id: { type: string }, name: { type: string } } }
        createdAt: { type: string, format: date-time }
